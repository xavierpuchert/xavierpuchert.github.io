<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join my circle on Lumi</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;background:#FBF7F0;color:#2E2A24;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}.code{font-size:32px;font-weight:800;letter-spacing:2px;margin:12px 0}a.b{display:inline-block;margin-top:16px;padding:14px 24px;border-radius:999px;background:#F2A33A;color:#2E2A24;font-weight:700;text-decoration:none;border:2px solid #2E2A24}p{color:#6B6358}</style></head>
<body><div id="app"><h1>Join my circle on Lumi</h1><p>Open this link on an iPhone with Lumi installed and we become friends.</p><div class="code" id="code"></div><p>No Lumi yet? Get the app, then add this code on the Friends tab.</p><a class="b" href="https://get-lumi.com">Get Lumi</a></div>
<script>var m=location.pathname.match(/\/friend\/([A-Za-z0-9-]+)/);if(m){document.getElementById('code').textContent=m[1].toUpperCase();}else{document.title='Lumi';document.getElementById('app').innerHTML='<h1>Lumi</h1><p>Phone-free focus, with a friend.</p><a class="b" href="https://get-lumi.com">Get Lumi</a>';}</script></body></html>
